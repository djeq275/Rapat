<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Divisi')}"></head>
<body>
<nav th:replace="~{fragments/layout :: nav}"></nav>
<main class="container">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h1 class="h4 mb-0">Divisi</h1>
        <a class="btn btn-primary" th:href="@{/admin/divisions/new}">Tambah Divisi</a>
    </div>
    <table class="table table-striped">
        <thead>
        <tr>
            <th>Nama</th>
            <th>Ketua Divisi User ID</th>
            <th></th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="division : ${divisions}">
            <td th:text="${division.name}"></td>
            <td th:text="${division.ketuaDivisiUserId} ?: '-'"></td>
            <td>
                <a th:href="@{/admin/divisions/{id}/edit(id=${division.id})}">Edit</a>
                &middot;
                <a th:href="@{/admin/divisions/{id}/telegram-groups(id=${division.id})}">Grup Telegram</a>
            </td>
        </tr>
        </tbody>
    </table>
</main>
</body>
</html>
