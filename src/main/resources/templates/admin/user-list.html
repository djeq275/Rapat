<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Pengguna')}"></head>
<body>
<nav th:replace="~{fragments/layout :: nav}"></nav>
<main class="container">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h1 class="h4 mb-0">Pengguna</h1>
        <a class="btn btn-primary" th:href="@{/admin/users/new}">Tambah Pengguna</a>
    </div>
    <table class="table table-striped">
        <thead>
        <tr>
            <th>Email</th>
            <th>Nama</th>
            <th>Role</th>
            <th>Divisi</th>
            <th>Aktif</th>
            <th></th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="user : ${users}">
            <td th:text="${user.email}"></td>
            <td th:text="${user.fullName}"></td>
            <td th:text="${user.role}"></td>
            <td th:text="${user.division != null ? user.division.name : '-'}"></td>
            <td th:text="${user.enabled} ? 'Ya' : 'Tidak'"></td>
            <td>
                <a th:href="@{/admin/users/{id}/edit(id=${user.id})}">Edit</a>
            </td>
        </tr>
        </tbody>
    </table>
</main>
</body>
</html>
