<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Form Grup Telegram')}"></head>
<body>
<nav th:replace="~{fragments/layout :: nav}"></nav>
<main class="container" style="max-width: 500px;">
    <h1 class="h4 mb-3">Form Grup Telegram</h1>
    <form method="post" th:object="${form}"
          th:action="${groupId} != null ? @{/admin/telegram-groups/{id}(id=${groupId})} : @{/admin/telegram-groups}">

        <div class="alert alert-danger" th:if="${#fields.hasErrors('global')}" th:errors="*{global}"></div>

        <div class="mb-3">
            <label class="form-label" for="name">Nama Grup</label>
            <input class="form-control" id="name" th:field="*{name}" required="required"/>
        </div>
        <div class="mb-3" th:if="${tokenConfigured}">
            <label class="form-label" for="chatCandidate">Pilih dari grup yang terdeteksi</label>
            <select class="form-select" id="chatCandidate" th:if="${not #lists.isEmpty(chatCandidates)}">
                <option value="">-- pilih grup --</option>
                <option th:each="candidate : ${chatCandidates}"
                        th:value="${candidate.chatId()}"
                        th:text="|${candidate.displayName()} (${candidate.chatId()})|"></option>
            </select>
            <p class="text-muted small mb-0" th:if="${#lists.isEmpty(chatCandidates)}">
                Belum ada grup terdeteksi. Kirim pesan apa pun ke grup dulu, lalu buka halaman ini lagi.
            </p>
        </div>
        <div class="mb-3">
            <label class="form-label" for="chatId">Chat ID</label>
            <input class="form-control" id="chatId" th:field="*{chatId}" required="required"/>
            <div class="form-text">Didapat setelah bot ditambahkan ke grup Telegram tujuan -- atau pilih dari daftar di atas kalau tersedia.</div>
        </div>
        <div class="mb-3 form-check">
            <input class="form-check-input" id="enabled" type="checkbox" th:field="*{enabled}"/>
            <label class="form-check-label" for="enabled">Aktif</label>
        </div>

        <button class="btn btn-primary" type="submit">Simpan</button>
        <a class="btn btn-link" th:href="@{/admin/telegram-groups}">Batal</a>
    </form>
</main>
<script th:if="${not #lists.isEmpty(chatCandidates)}">
    document.getElementById('chatCandidate').addEventListener('change', function () {
        if (this.value) {
            document.getElementById('chatId').value = this.value;
        }
    });
</script>
</body>
</html>
