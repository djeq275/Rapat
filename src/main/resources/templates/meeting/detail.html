<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Detail Rapat')}"></head>
<body>
<nav th:replace="~{fragments/layout :: nav}"></nav>
<main class="container" style="max-width: 700px;">
    <h1 class="h4" th:text="${meeting.title}"></h1>
    <p class="text-muted">
        <span th:text="${meeting.division.name}"></span>
        &middot; Organizer: <span th:text="${meeting.organizer.fullName}"></span>
    </p>

    <dl class="row">
        <dt class="col-sm-3">Waktu</dt>
        <dd class="col-sm-9">
            <span th:text="${#temporals.format(meeting.startTimeLocal, 'dd MMM yyyy HH:mm')}"></span>
            &ndash;
            <span th:text="${#temporals.format(meeting.endTimeLocal, 'dd MMM yyyy HH:mm')}"></span>
        </dd>

        <dt class="col-sm-3">Keterangan</dt>
        <dd class="col-sm-9" th:text="${meeting.description} ?: '-'"></dd>

        <dt class="col-sm-3">Link Materi</dt>
        <dd class="col-sm-9">
            <a th:if="${meeting.materialLink}" th:href="${meeting.materialLink}" th:text="${meeting.materialLink}" target="_blank"></a>
            <span th:unless="${meeting.materialLink}">-</span>
        </dd>

        <dt class="col-sm-3">Status Sync Kalender</dt>
        <dd class="col-sm-9">
            <span th:text="${meeting.calendarSyncStatus}"></span>
            <span class="text-danger small" th:if="${meeting.calendarSyncError}" th:text="${meeting.calendarSyncError}"></span>
        </dd>

        <dt class="col-sm-3">Peserta</dt>
        <dd class="col-sm-9">
            <ul class="list-unstyled mb-0">
                <li th:each="p : ${participants}" th:text="${p.user.fullName}"></li>
            </ul>
        </dd>

        <dt class="col-sm-3">Notulensi</dt>
        <dd class="col-sm-9">
            <a th:if="${meeting.notulensiLink}" th:href="${meeting.notulensiLink}" th:text="${meeting.notulensiLink}" target="_blank"></a>
            <p th:if="${meeting.notulensiText}" th:text="${meeting.notulensiText}"></p>
            <span th:if="${meeting.notulensiLink == null and meeting.notulensiText == null}">Belum ada notulensi.</span>
        </dd>
    </dl>

    <a th:href="@{/meetings}">&larr; Kembali ke daftar rapat</a>
</main>
</body>
</html>
