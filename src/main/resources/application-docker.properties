# Active only when SPRING_PROFILES_ACTIVE=docker (see compose.yaml's "meeting"
# service). spring-boot-docker-compose (the auto-wiring used by ./gradlew
# bootRun) is a developmentOnly dependency and is absent from the packaged
# image entirely, so a containerized run needs its datasource spelled out
# explicitly -- deliberately kept out of the main application.properties,
# since setting spring.datasource.* there would make Boot back off from that
# bootRun auto-wiring and break local dev.
spring.datasource.url=jdbc:mariadb://${DB_HOST}:${DB_PORT}/${DB_NAME}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
