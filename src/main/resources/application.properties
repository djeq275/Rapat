spring.application.name=vibe1

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.xml

# google-login and google-calendar registrations are no longer declared here
# -- both are built dynamically from GoogleOAuthConfig (admin-managed, see
# security.DynamicClientRegistrationRepository). GOOGLE_OAUTH_CLIENT_ID/SECRET
# still exist as env vars, but only as a one-time bootstrap seed for existing
# installs (security.GoogleOAuthConfigBootstrap), not read here anymore.
# NOTE: google-calendar's redirect-uri ({baseUrl}/connect/google-calendar)
# must still be added to the OAuth client's "Authorized redirect URIs" in
# Google Cloud Console, e.g. http://localhost:8080/connect/google-calendar.

google.token-encryption-key=${GOOGLE_TOKEN_ENCRYPTION_KEY:zewUwGu3cxKW1og8D1n5Npd5ha/F5B5nK0H41GPDf8o=}

# Separate key from google.token-encryption-key above -- Telegram's bot token
# and Google's OAuth tokens are different secret categories and shouldn't
# share one key (see common.AesGcmStringConverter).
telegram.token-encryption-key=${TELEGRAM_TOKEN_ENCRYPTION_KEY:/Pdq/AjglTn5wmdsYAGDm6iCWWlTzp3/N7tn5Xpco9M=}

# Separate key from the two above -- Keycloak's client secret is yet another
# secret category and shouldn't share a key with Google/Telegram (see
# common.AesGcmStringConverter).
keycloak.token-encryption-key=${KEYCLOAK_TOKEN_ENCRYPTION_KEY:VDTRHCYHEJFLq25VXqGlJOswRo7WM7aIRldnAD0Qr9A=}

# Separate key again -- this encrypts GoogleOAuthConfig's client secret (the
# OAuth app's own credential, admin-managed, issue #31), NOT the same thing
# as google.token-encryption-key above (per-user access/refresh tokens).
google.oauth-client-encryption-key=${GOOGLE_OAUTH_CLIENT_ENCRYPTION_KEY:kOU2kV9Wzw3F3x8bqLVzBy3vkcTld2tGIiv2bf2YKGY=}
